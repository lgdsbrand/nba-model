# Rebuilds the NBA predictor's data (nba/data/) from ESPN five times a day and
# commits it; the commit redeploys the page. See pipeline/nba_data.py.
#   14:17 UTC: last night's games are final, today's lines are up.
#   18:17, 21:43, 23:13, 01:13 UTC: fresher lines; each game's prediction is
#   frozen at the last run before it tips (pipeline/cards.py).
# Off the hour on purpose: GitHub delayed the old on-the-hour runs by two to
# four hours, so the evening run often landed after the 7 p.m. ET tip-offs.
# "Run workflow" on the Actions tab runs it on demand.
name: NBA data

on:
  schedule:
    - cron: "17 14 * * *"
    - cron: "17 18 * * *"
    - cron: "43 21 * * *"
    - cron: "13 23 * * *"
    - cron: "13 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the data
        run: python pipeline/nba_data.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data data/raw
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "NBA data $(date -u +'%Y-%m-%d %H:%M') UTC"
            # A code change pushed while the job ran would reject a plain push.
            git pull --rebase
            git push
          fi
