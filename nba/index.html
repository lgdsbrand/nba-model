<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NBA · Legends Sports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="NBA game predictions: projected scores, win probabilities and fair prices for every game." />
  <style>
    :root {
      --bg: #050814;
      --panel: #121828;
      --panel-2: #0b0f1c;
      --inset: #080b16;
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --dim: #64748b;
      --accent: #2563eb;
      --accent-2: #4f46e5;
      --win: #22c55e;
      --win-soft: rgba(34, 197, 94, 0.1);
      --loss: #f43f5e;
      --loss-soft: rgba(244, 63, 94, 0.1);
      --amber: #f5a623;
      --amber-soft: rgba(245, 166, 35, 0.1);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #141a2e 0, var(--bg) 55%) fixed;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }

    .caption {
      font-size: 0.66rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--dim);
    }
    .muted { color: var(--muted); }
    .tiny { font-size: 0.7rem; color: var(--dim); line-height: 1.45; }
    .win { color: var(--win); }
    .loss { color: var(--loss); }
    .num { font-variant-numeric: tabular-nums; }

    /* Date strip */
    .dates-label { text-align: center; font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
    .dates { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
    .date-btn {
      flex: 0 1 92px; min-width: 0; border: 1px solid var(--border-strong); background: var(--panel);
      color: var(--text); border-radius: 10px; padding: 9px 4px; cursor: pointer; text-align: center;
      font: inherit; transition: background 0.15s;
    }
    .date-btn:hover { background: #1a2236; }
    .date-btn .caption { display: block; margin-bottom: 3px; font-size: 0.6rem; }
    .date-btn strong { font-size: 0.95rem; white-space: nowrap; }
    .date-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }
    .date-btn.active .caption { color: rgba(255, 255, 255, 0.85); }

    /* Panels */
    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 16px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); overflow: hidden;
    }
    .panel-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 12px; }
    .panel-head .bar { width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }
    .panel-head h2 { margin: 0; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; }
    .panel-head .right { margin-left: auto; font-size: 0.75rem; font-weight: 700; }
    .panel-body { padding: 0 16px 16px; }
    .panel-body[hidden] { display: none; }
    .panel-head.toggle {
      width: 100%; border: 0; background: none; color: var(--text); font: inherit; cursor: pointer; text-align: left;
    }
    .panel-head.toggle:hover h2 { color: #fff; }
    .team-power { font-size: 0.7rem; font-weight: 700; color: var(--muted); margin-top: -4px; letter-spacing: 0.02em; }
    .game-score {
      display: flex; align-items: baseline; gap: 6px; padding: 4px 10px; border-radius: 999px;
      background: var(--inset); border: 1px solid var(--border-strong); cursor: help;
    }
    .game-score .caption { font-size: 0.55rem; }
    .game-score b { font-size: 0.95rem; font-weight: 800; }
    .game-score.good b { color: var(--win); }
    .game-score.hot { border-color: rgba(245, 166, 35, 0.5); background: var(--amber-soft); }
    .game-score.hot b { color: var(--amber); }

    .tops { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .top { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .top .pick { font-weight: 700; font-size: 0.9rem; margin: 3px 0 4px; }
    .top .pct { font-weight: 800; font-size: 1rem; color: var(--win); }
    .top.won { border-color: rgba(34, 197, 94, 0.4); }
    .top.lost { border-color: rgba(244, 63, 94, 0.4); }

    /* Game card */
    .game-top {
      display: grid; grid-template-columns: 1fr minmax(150px, 230px) 1fr; gap: 12px;
      align-items: start; padding: 20px 16px 16px;
    }
    .team { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; min-width: 0; }
    .logo {
      width: 76px; height: 76px; border-radius: 50%; background: var(--inset);
      border: 1px solid var(--border-strong); display: grid; place-items: center; overflow: hidden;
    }
    .logo img { width: 58px; height: 58px; object-fit: contain; }
    .logo .abbr { font-weight: 800; font-size: 1.1rem; color: var(--muted); }
    .team-name { font-weight: 700; font-size: 1rem; line-height: 1.2; }
    .team-record { font-size: 0.75rem; color: var(--muted); margin-top: -4px; }
    .ml-box {
      min-width: 76px; padding: 8px 12px; border-radius: 8px; background: var(--inset);
      border: 1px solid var(--border-strong); font-weight: 800; font-size: 1rem;
    }
    .ml-box.fav { color: var(--win); }
    .ml-box .caption { display: block; font-size: 0.55rem; margin-bottom: 2px; }
    .middle { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .pill {
      display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--inset);
      border: 1px solid var(--border-strong); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em;
    }
    .pill.live { color: var(--loss); border-color: rgba(244, 63, 94, 0.4); }
    .pill.final { color: var(--muted); }
    .pill.best {
      color: #22d3ee; border-color: rgba(34, 211, 238, 0.45); background: rgba(34, 211, 238, 0.08);
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .top .pill.best { float: right; padding: 2px 7px; }
    .pill.b2b {
      color: var(--amber); border-color: rgba(245, 166, 35, 0.45); background: var(--amber-soft);
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: help;
    }
    .at { font-size: 1.3rem; font-weight: 800; color: var(--dim); line-height: 1; }
    .ou { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); }
    .final-score { font-size: 1.6rem; font-weight: 800; }
    .records { width: 100%; margin-top: 4px; border-collapse: separate; border-spacing: 0 4px; }
    .records td {
      font-size: 0.72rem; font-weight: 700; padding: 5px 8px; background: var(--inset);
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .records td:first-child { border-left: 1px solid var(--border); border-radius: 6px 0 0 6px; }
    .records td:last-child { border-right: 1px solid var(--border); border-radius: 0 6px 6px 0; text-align: right; }
    .records td.label { text-align: center; color: var(--dim); font-size: 0.62rem; letter-spacing: 0.1em; }

    .numbers {
      margin: 0 16px; display: grid; grid-template-columns: 1fr 1.3fr 1fr; align-items: center;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 8px;
    }
    .numbers > div { text-align: center; min-width: 0; }
    .numbers > div + div { border-left: 1px solid var(--border); }
    .numbers .caption.lead { color: var(--win); }
    .big { font-size: 1.55rem; font-weight: 800; margin-top: 4px; }
    .fair { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .proj .dash { color: var(--dim); margin: 0 6px; font-weight: 600; }

    .lines { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 16px 0; }
    .line-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .line-row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.82rem; margin-top: 4px; }
    .line-row b { font-weight: 800; }
    .line-box.gap-mid { border-color: rgba(245, 166, 35, 0.45); }
    .line-box.gap-big { border-color: var(--amber); background: var(--amber-soft); }
    .gap-row { color: var(--amber); font-size: 0.75rem; }
    .line-box.gap-big .gap-row { font-weight: 700; }
    .note { margin: 12px 16px 0; font-size: 0.8rem; color: var(--muted); }

    .details-btn {
      display: block; width: 100%; margin-top: 16px; padding: 14px; border: 0; border-top: 1px solid var(--border);
      background: #182036; color: var(--text); font: inherit; font-weight: 700; font-size: 0.75rem;
      letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
    }
    .details-btn:hover { background: #1d2742; }
    .details-btn.bottom { margin-top: 0; }
    .details-btn[hidden] { display: none; }
    .details { padding: 16px; border-top: 1px solid var(--border); display: grid; gap: 20px; }
    .details[hidden] { display: none; }
    .details h3 { margin: 0 0 8px; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

    .scroll { overflow-x: auto; }
    table.grid { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    table.grid th, table.grid td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: center; white-space: nowrap; }
    table.grid th { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
    table.grid td:first-child, table.grid th:first-child { text-align: left; }
    table.grid td.better { color: var(--win); font-weight: 700; }
    table.grid td .rank { color: var(--dim); font-weight: 500; font-size: 0.7rem; }
    .verdict {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin-bottom: 8px;
      padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border); font-size: 0.82rem;
    }
    .verdict b { font-size: 0.95rem; }
    .pace-note {
      margin: 10px 0 6px; padding: 8px 10px; border-radius: 8px; font-size: 0.8rem; line-height: 1.45;
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chip { display: inline-block; min-width: 20px; padding: 1px 5px; border-radius: 5px; font-size: 0.68rem; font-weight: 800; }
    .chip.W, .chip.O { background: var(--win-soft); color: var(--win); }
    .chip.L, .chip.U { background: var(--loss-soft); color: var(--loss); }
    .chip.P { background: rgba(148, 163, 184, 0.12); color: var(--muted); }

    .whatif label { display: block; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
    .whatif input {
      width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border-strong);
      background: var(--inset); color: var(--text); font: inherit; font-size: 0.8rem; margin-bottom: 8px;
    }
    .whatif button {
      padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; color: #fff; font: inherit; font-weight: 700;
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    .whatif-out { margin-top: 10px; font-size: 0.85rem; }

    .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
    .footnote { text-align: center; margin-top: 24px; }

    @media (max-width: 640px) {
      .page { padding: 16px 12px 40px; }
      .dates { gap: 5px; }
      .date-btn { padding: 8px 2px; }
      .date-btn .caption { font-size: 0.5rem; letter-spacing: 0.04em; }
      .date-btn strong { font-size: 0.8rem; }
      .game-top { grid-template-columns: 1fr 1fr; padding: 16px 12px 12px; row-gap: 14px; }
      .middle { grid-column: 1 / -1; grid-row: 2; }
      .logo { width: 60px; height: 60px; }
      .logo img { width: 46px; height: 46px; }
      .team-name { font-size: 0.9rem; }
      .numbers { margin: 0 12px; padding: 12px 4px; }
      .big { font-size: 1.2rem; }
      .lines { grid-template-columns: 1fr; margin: 12px 12px 0; }
      .note { margin: 12px 12px 0; }
      .details { padding: 14px 12px; }
      .two { grid-template-columns: 1fr; }
      table.grid th, table.grid td { padding: 5px 4px; }
    }
  </style>
</head>
<body>
  <!-- The Legends Sports header (legends-header.js): this page lives at
       lgdsanalytics.vercel.app/nba, inside the client's site. -->
  <div id="legends-header" data-sport="nba" data-subtitle="NBA Game Predictions (Beta)" data-logo="/nba/legends-logo.png"></div>
  <script src="/nba/legends-header.js"></script>

  <main class="page">
    <div class="dates-label">Dates in Eastern Time</div>
    <nav class="dates" id="dates" aria-label="Game day"></nav>
    <div id="board"><div class="empty">Loading games…</div></div>
    <p class="tiny footnote" id="footnote"></p>
  </main>

  <!-- Absolute, so the page works at /nba as well as /nba/. -->
  <script src="/nba/app.js" defer></script>
</body>
</html>
